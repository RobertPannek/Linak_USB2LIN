name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python on GitHub runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install hidapi pyinstaller

      - name: Build standalone EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Tischsteuerung tischsteuerung.pyw

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tischsteuerung-Windows-EXE
          path: dist/Tischsteuerung.exe
          if-no-files-found: error
